<div id="app"></div>
<script>
/* Contenu du test — la bonne réponse est TOUJOURS écrite en premier (l'ordre est mélangé à l'affichage). */
window.TEST = {
  code: 'BUREAUTIQUE',
  titre: 'Bureautique certifiante',

  duree: 20,

    { id: 'win', nom: 'Windows et fichiers' },
    { id: 'word', nom: 'Word' },
    { id: 'excel', nom: 'Excel' },
    { id: 'ppt', nom: 'PowerPoint' },
    { id: 'web', nom: 'Outlook et outils en ligne' }
  ],
  questions: [
    { d: 'win', q: 'Quel raccourci clavier permet de copier un élément sélectionné ?',
      o: ['Ctrl + C', 'Ctrl + V', 'Ctrl + X', 'Ctrl + Z'] },
    { d: 'win', q: 'Que se passe-t-il quand on supprime un fichier sur l\'ordinateur ?',
      o: ['Il va dans la Corbeille', 'Il est effacé définitivement tout de suite', 'Il est envoyé par mail', 'Il est copié sur une clé USB'] },

      o: ['C\'est l\'extension : le fichier est un document Word', 'C\'est le dossier où il est rangé', 'C\'est la taille du fichier', 'C\'est le nom de l\'auteur'] },

      o: ['Des dossiers', 'Des raccourcis', 'Des extensions', 'Des onglets'] },

    { d: 'word', q: 'Dans Word, quel bouton du ruban met le texte en gras ?',

    { d: 'word', q: 'Pour que le numéro de page apparaisse automatiquement en bas de chaque page, on utilise :',
      o: ['Le pied de page', 'Une zone de texte sur chaque page', 'Un tableau', 'La touche Entrée'] },
    { d: 'word', q: 'À quoi sert le publipostage dans Word ?',

    { d: 'word', q: 'Pour commencer une nouvelle page sans appuyer plusieurs fois sur Entrée, on insère :',
      o: ['Un saut de page', 'Un tableau', 'Une tabulation', 'Une image'] },

    { d: 'excel', q: 'Dans Excel, comment s\'appelle la cellule située colonne B, ligne 3 ?',
      o: ['B3', '3B', 'C2', 'B-3'] },
    { d: 'excel', q: 'Quelle formule calcule la somme des cellules A1 à A10 ?',

      o: ['100', '25', '4', '15'] },
    { d: 'excel', q: 'La formule =SI(B2>=10;"Admis";"Refusé") affiche « Admis » quand :',

    { d: 'web', q: 'Dans un mail, à quoi sert le champ « Cc » ?',

      o: ['Word', 'Excel', 'PowerPoint', 'Outlook ou une messagerie', 'Aucun'] },
    { q: 'Avez-vous un ordinateur à la maison ?',
      o: ['Oui, avec Internet', 'Oui, sans Internet', 'Non, seulement un smartphone', 'Non'] },
    { q: 'Quel est votre objectif principal ?',
      o: ['Trouver un emploi de bureau', 'Obtenir une certification', 'Évoluer dans mon poste actuel', 'Prendre confiance avec l\'ordinateur'] }
